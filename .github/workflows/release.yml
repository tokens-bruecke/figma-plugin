on:
  push:
    tags:
      - 'v*'
name: release
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Build package
        run: pnpm run build

      # Trusted publishing (OIDC) needs npm >= 11.5.1; pin it rather than
      # depending on whatever the runner's Node happens to bundle.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      # Authenticates via the OIDC id-token, so no NPM_TOKEN is involved.
      # Provenance is attached automatically.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub release
        run: gh release create ${{ github.ref_name }} ./dist/figma-plugin.zip --title "${{ github.ref_name }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull origin main
          VERSION="${GITHUB_REF_NAME#v}"
          if grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md already documents ${VERSION} — skipping (safe on re-runs)."
            exit 0
          fi
          # -r 2, not -r 1: on a tag push HEAD sits on the tag, so "the latest
          # release" (-r 1) is the empty unreleased range and nothing is written.
          # -r 2 reaches back one further and emits the tagged release's section.
          npx --yes conventional-changelog-cli -p conventionalcommits -i CHANGELOG.md -s -r 2
          npx --yes prettier --write CHANGELOG.md
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::conventional-changelog produced no section for ${VERSION}"
            exit 1
          fi
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for ${{ github.ref_name }}"
          git push origin main
